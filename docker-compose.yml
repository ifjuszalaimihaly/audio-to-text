version: "3.9"

services:
  backend:
    build: backend
    ports:
      - 0.0.0.0:8000:8000
    volumes:
      - ./audio:/audio
  fronted:
    build: frontend
    ports:
    - 0.0.0.0:8080:8080
  db:
    # kész image pgvector-rel; ha nem elérhető nálad, lásd alternatívát lent
    image: pgvector/pgvector:pg16
    container_name: pgvector-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db
    environment:
      ADMINER_DESIGN: ${ADMINER_DESIGN}
volumes:
  db_data:

